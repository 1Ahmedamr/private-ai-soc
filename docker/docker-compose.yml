services:
  postgres:
    image: postgres:16
    container_name: soc_postgres
    environment:
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_dev_password
      POSTGRES_DB: private_ai_soc
    ports:
      - "5432:5432"
    volumes:
      - soc_pg_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: soc_ollama
    ports:
      - "11434:11434"
    volumes:
      - soc_ollama_models:/root/.ollama

  soc_app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs

volumes:
  soc_pg_data:
  soc_ollama_models: