title: Admin Account Targeted by Failed Logon
id: cf743b77-6b0e-4c5b-8e5f-9d1a2c3b4e5f
status: stable
description: Detects failed logon attempts specifically targeting administrative accounts
references:
    - https://attack.mitre.org/techniques/T1078/
author: Private AI SOC
date: 2024/01/01
tags:
    - attack.t1078
    - attack.defense_evasion
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: '4625'
        TargetUserName|contains:
            - 'admin'
            - 'administrator'
            - 'root'
            - 'sysadmin'
    condition: selection
level: high
falsepositives:
    - Legitimate admin login failures
