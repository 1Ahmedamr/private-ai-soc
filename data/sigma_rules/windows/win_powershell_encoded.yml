title: PowerShell Encoded Command Execution
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: stable
description: Detects PowerShell execution with encoded command parameter indicating obfuscation
references:
    - https://attack.mitre.org/techniques/T1059.001/
author: Private AI SOC
date: 2024/01/01
tags:
    - attack.t1059.001
    - attack.execution
logsource:
    product: windows
    service: security
detection:
    selection:
        CommandLine|contains:
            - '-enc'
            - '-encodedcommand'
            - '-EncodedCommand'
    condition: selection
level: high
falsepositives:
    - Legitimate PowerShell scripts using encoded commands
