title: SSH Authentication Failure
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: stable
description: Detects failed SSH authentication events on Linux systems
references:
    - https://attack.mitre.org/techniques/T1110/
author: Private AI SOC
date: 2024/01/01
tags:
    - attack.t1110
    - attack.credential_access
logsource:
    product: linux
    service: auth
detection:
    selection:
        EventID: 'failed_password'
    condition: selection
level: low
falsepositives:
    - Legitimate user typos
    - Automated backup scripts with wrong credentials
